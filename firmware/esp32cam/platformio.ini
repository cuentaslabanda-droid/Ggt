; Firmware de la cámara de curado (ESP32-CAM AI-Thinker)
; Compilar:  pio run          Subir:  pio run -t upload
; Tests de la lógica de control en el PC:  pio test -e native

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
test_ignore = *

[env:native]
platform = native
build_src_filter = -<*> +<controller.cpp>
test_build_src = yes
build_flags = -std=c++17
