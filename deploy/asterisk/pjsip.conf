; Asterisk PJSIP para la cámara de curado.
; Un único "trunk": el puerto FXO de la pasarela Grandstream HT813, que se
; registra en Asterisk como usuario "fxo" y conecta con la línea analógica.
; install-asterisk.sh sustituye @FXO_PASSWORD@.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[fxo]
type=endpoint
transport=transport-udp
context=curado-entrante
disallow=all
allow=ulaw,alaw
auth=fxo-auth
aors=fxo
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[fxo-auth]
type=auth
auth_type=userpass
username=fxo
password=@FXO_PASSWORD@

[fxo]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60
