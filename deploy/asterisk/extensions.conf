; Plan de marcado de la cámara de curado.
; install-asterisk.sh sustituye @SOUNDS@ y @PIN@.

[general]
static=yes
writeprotect=yes

[globals]
CURADO_SOUNDS=@SOUNDS@
CURADO_API=http://127.0.0.1:8000
CURADO_PIN=@PIN@

; --- Llamada saliente de alarma ----------------------------------------------
; El servidor deja un .call en /var/spool/asterisk/outgoing con MSG = ruta del
; audio (sin .wav). Una línea analógica no siempre avisa de cuándo descuelgan,
; así que el mensaje se repite 4 veces esperando que pulsen 1.
[curado-alarma]
exten => s,1,NoOp(Alarma curado ${MSG})
 same => n,Wait(1)
 same => n,Set(TRIES=0)
 same => n(loop),Set(TRIES=$[${TRIES} + 1])
 same => n,Read(DIGIT,${MSG},1,,1,6)
 same => n,GotoIf($["${DIGIT}" = "1"]?ack)
 same => n,GotoIf($[${TRIES} < 4]?loop)
 same => n,Hangup()
 same => n(ack),System(curl -s -m 10 -X POST '${CURADO_API}/api/alarm/ack?by=llamada')
 same => n,Playback(${CURADO_SOUNDS}/confirmada)
 same => n,Hangup()

; --- Llamada entrante por la línea analógica ------------------------------------
; Dice temperatura, humedad y alarmas. Para confirmar una alarma desde aquí hace
; falta el PIN (cualquiera puede llamar a la línea de casa).
[curado-entrante]
exten => curado,1,Goto(s,1)
exten => _X.,1,Goto(s,1)
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,System(curl -s -m 20 -X POST '${CURADO_API}/api/voice/status')
 same => n,Set(TRIES=0)
 same => n(loop),Set(TRIES=$[${TRIES} + 1])
 same => n,Read(DIGIT,${CURADO_SOUNDS}/estado&${CURADO_SOUNDS}/menu,1,,1,6)
 same => n,GotoIf($["${DIGIT}" = "1"]?pin)
 same => n,GotoIf($["${DIGIT}" = "2"]?loop)
 same => n,GotoIf($[${TRIES} < 2]?loop)
 same => n,Hangup()
 same => n(pin),Read(PIN,${CURADO_SOUNDS}/pin,4,,1,10)
 same => n,GotoIf($["${PIN}" = "${CURADO_PIN}"]?ack)
 same => n,Playback(${CURADO_SOUNDS}/pin-error)
 same => n,Hangup()
 same => n(ack),System(curl -s -m 10 -X POST '${CURADO_API}/api/alarm/ack?by=llamada-entrante')
 same => n,Playback(${CURADO_SOUNDS}/confirmada)
 same => n,Hangup()
